[HOST]
SCHEME = "http://"
HOSTNAME = "localhost"
PORT = ":8082"

[DATABASE]
DATABASE_DRIVER = "sqlite"
DATABASE_DSN = "main.db?_foreign_keys=on&_busy_timeout=5000&_txlock=immediate"
# PostgreSQL example:
# DATABASE_DRIVER = "postgres"
# DATABASE_DSN = "host=localhost port=5432 user=main dbname=main sslmode=disable"

[METADATA]
NODE_NAME = "開発図書館"
APPLICATION_NAME = "メインサービス"
NODE_DOMAIN = "localhost"
NODE_ADMINS = []
MAINTAINER = []

[BRANDRESOURCES]
# HEADER = "./resources/header.svg"

[WEB]
PUBLIC_ORIGIN = "http://localhost:8082"

[REPOSITORY]
# Set the same random TOKEN in repository-service's [CATALOG] section.
BASE_URL = "http://localhost:8081"
# TOKEN = "replace-with-at-least-32-random-characters"

[SSG]
OUTPUT_DIR = "./generated"
INTERVAL = "5m" # 0s disables the timer; startup/manual generation remains available.
# In Compose, the gateway validates and publishes each generation.
GATEWAY_MANAGED = false
